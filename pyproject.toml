[project]
name = "nbclaw"
version = "0.1.4"
description = "No Bullshit Claw — a 24/7 Signal-driven Swival agent daemon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "swival>=1.0.46",
    "httpx>=0.28.1",
    "croniter>=6.2.4",
]

[project.scripts]
nbclaw = "nbclaw.__main__:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbclaw"]

[tool.hatch.build.targets.sdist]
include = [
    "nbclaw/",
    "tests/",
    "deploy/",
    "README.md",
    "LICENSE",
    "nbclaw.toml.example",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
